<!--
  COMPUTE CAFE EXPLORER TEMPLATE
  Edit ONLY the CONFIG, TYPE_META, and VENUES blocks in the <script> at the
  bottom (plus <title> above). Filter chips, section headers, and header stats
  all derive from the data — no markup edits needed for a new city or venue mix.
  Keep the file self-contained: no external CSS/JS/fonts beyond Leaflet from unpkg;
  geocoding caches per-browser via the browser Cache API (works without localStorage).

<style>

    --hairline: rgba(11,11,11,0.10);
    --grid: #e1e0d9;
    --accent-a: #eb6834;
    --accent-a-soft: rgba(235,104,52,0.12);
    --accent-b: #2a78d6;
    --accent-b-soft: rgba(42,120,214,0.12);
    --accent-c: #6f4fce;
    --accent-c-soft: rgba(111,79,206,0.12);
    --good: #0ca30c;
    --good-soft: rgba(12,163,12,0.10);
    --chip-on: #0b0b0b;
    --chip-on-ink: #fcfcfb;
    --ph-a: #f3e7dc;
    --ph-b: #e8d5c2;
    --ph-c: #dde8f3;
    --ph-d: #c9d9ec;
    --ph-e: #e7ddf3;
    --ph-f: #d6c8ec;
    --shadow: 0 1px 2px rgba(11,11,11,0.05), 0 4px 14px rgba(11,11,11,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --hairline: rgba(255,255,255,0.10); --grid: #2c2c2a;
      --accent-a: #d95926; --accent-a-soft: rgba(217,89,38,0.18);
      --accent-b: #3987e5; --accent-b-soft: rgba(57,135,229,0.18);
      --accent-c: #8f6ee8; --accent-c-soft: rgba(143,110,232,0.18);
      --good: #0ca30c; --good-soft: rgba(12,163,12,0.16);
      --chip-on: #ffffff; --chip-on-ink: #0d0d0d;
      --ph-a: #33281f; --ph-b: #453425; --ph-c: #1f2a38; --ph-d: #2a3a4e;
      --ph-e: #291f38; --ph-f: #382a4e;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
    --hairline: rgba(255,255,255,0.10); --grid: #2c2c2a;
    --accent-a: #d95926; --accent-a-soft: rgba(217,89,38,0.18);

  body {

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* Map primitives — Leaflet helpers (also used by index.html) */
(function () {
  const ACCENT = { live: "#0ca30c", rsvp: "#2a78d6", soon: "#898781" };
  const isDark = () => {
    const t = document.documentElement.getAttribute("data-theme");
    return t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  };
  function baseLayers(L) {
    return {
      light: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }),
      dark: L.tileLayer("https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpg", {
        maxZoom: 19, maxNativeZoom: 8,
        attribution: "NASA Earth at Night (VIIRS Black Marble) · EOSDIS GIBS",
      }),
    };
  }
  window.__syncMapTheme = function () {
    const map = window.__map;
    if (!map || !map.__layers) return;
    const want = isDark() ? map.__layers.dark : map.__layers.light;
    const other = isDark() ? map.__layers.light : map.__layers.dark;
    if (!map.hasLayer(want)) map.addLayer(want);
    if (map.hasLayer(other)) map.removeLayer(other);
  };


  window.initMap = function (container, data) {
    const L = window.L;
    if (!L) return null;
    const el = container;
    el.innerHTML = "";
    const map = L.map(el, { zoomControl: true, scrollWheelZoom: false });
    map.__layers = baseLayers(L);
    (isDark() ? map.__layers.dark : map.__layers.light).addTo(map);
    const pts = [];
    (data.venues || []).forEach(v => pts.push(v));
    (data.cities || []).forEach(c => pts.push(c));
    const latLngs = [];
    pts.forEach(it => {
      const isCity = !!it.kind && it.kind === "city";
      const color = isCity ? (ACCENT[it.status] || ACCENT.soon) : ACCENT.live;
      const m = L.circleMarker([it.lat, it.lng], {
        radius: isCity ? 7 : 6, color, weight: 2, fillColor: color, fillOpacity: 0.55,
      });
      const href = it.href;
      const label = it.name;
      const sub = it.area || it.date || "";
      const popup = `<div style="max-width:220px"><b>${label}</b><div style="font-size:12px;color:#666">${sub}</div>${href ? `<div style="margin-top:6px"><a href="${href}" ${href.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>Open →</a></div>` : ""}</div>`;
      m.bindPopup(popup);
      m.addTo(map);
      if (href) m.on("click", () => m.openPopup());
      latLngs.push(m.getLatLng());
    });
    if (latLngs.length === 1) map.setView(latLngs[0], 12);
    else if (latLngs.length > 1) { map.__bounds = L.latLngBounds(latLngs); map.fitBounds(map.__bounds, { padding: [30, 30] }); }
    else map.setView([0, 0], 2);
    return map;
  };

  window.toggleMap = function (container, data) {
    const el = container;
    if (el.style.display === "block") {
      el.style.display = "none";
      el.setAttribute("aria-hidden", "true");
      document.body.classList.remove("map-open");
      return false;
    }
    el.style.display = "block";
    el.setAttribute("aria-hidden", "false");
    document.body.classList.add("map-open");
    if (!el.dataset.mounted) {
      el.dataset.mounted = "1";
      window.__map = window.initMap(el, data);
      requestAnimationFrame(() => {
        window.__map.invalidateSize();
        if (window.__map.__bounds) window.__map.fitBounds(window.__map.__bounds, { padding: [30, 30] });
      });
    }
    return true;
  };

  // Venues carry build-time lat/lng (scripts/geocode_configs.py) — no client geocoding.
  window.toggleCityMap = function () {
    const el = document.getElementById("mapbox");
    const pts = (typeof VENUES !== "undefined" ? VENUES : [])
      .filter(v => v.lat && v.lng)
      .map(v => ({ name: v.name, area: v.area, href: v.link, lat: v.lat, lng: v.lng }));
    const open = window.toggleMap(el, { venues: pts });
    const btn = document.getElementById("mapbtn");
    btn.textContent = open ? "🗺️ Hide Map" : "🗺️ View Map";
    btn.classList.toggle("open", !!open);
    btn.setAttribute("aria-pressed", String(!!open));
  };
})();

/* ============================ EDIT ABOVE ============================ */
const CITY_SLUG = location.pathname.split("/").filter(Boolean).pop() || "";

const state = { area: "all", type: "all", dedicatedOnly: false };
const AREAS = [...new Set(VENUES.map(v => v.area))];
const typeKeys = Object.keys(TYPE_META);
const tcls = t => "t" + (typeKeys.indexOf(t) % 3);

function initials(name){
  return name.replace(/[^a-zA-Z ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
}
function mapsUrl(v){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(v.name + " " + v.addr);
}
function card(v){
  const t = TYPE_META[v.type] || { label: v.type, icon: "📍" };
  const flagHtml = v.flag === "dedicated"
    ? '<span class="flag dedicated">✓ Dedicated events page</span>'
    : '<span class="flag contact">✉ Events contact only</span>';
  const imgHtml = v.img
    ? `<img src="${v.img}" alt="${v.alt}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.card').classList.add('noimg')">`
    : "";
  const emailBtn = v.email ? `<a class="btn sec" href="mailto:${v.email}">${v.email}</a>` : "";
  return `<div class="card${v.img ? "" : " noimg"}">
    <div class="imgbox">
      ${imgHtml}
      <div class="ph ${tcls(v.type)}"><span class="icn">${t.icon}</span><span class="mono">${initials(v.name)}</span></div>
      ${v.top ? '<div class="toppick">★ Top pick</div>' : ""}
      <div class="areatag">${v.area}</div>
    </div>
    <div class="body">
      <div class="titlerow"><div class="vname">${v.name}</div><span class="typechip ${tcls(v.type)}">${t.icon} ${t.label}</span></div>
      <div class="addr"><a href="${mapsUrl(v)}" target="_blank" rel="noopener">📍 ${v.addr}</a></div>
      <div class="cap">${v.cap}</div>
      ${flagHtml}
      <div class="note">${v.note}</div>
      <div class="links"><a class="btn pri" href="${v.link}" target="_blank" rel="noopener">${v.linkText} ↗</a>${emailBtn}<button class="starh" data-k="${v.k}" data-city="${CITY_SLUG}"></button></div>
    </div>
  </div>`;
}
function render(){
  const match = v =>
    (state.area === "all" || v.area === state.area) &&
    (state.type === "all" || v.type === state.type) &&
    (!state.dedicatedOnly || v.flag === "dedicated");
  const shown = VENUES.filter(match);
  const areas = AREAS.filter(a => state.area === "all" || a === state.area);
  let html = "";
  for (const a of areas){
    const items = shown.filter(v => v.area === a);
    if (!items.length) continue;
    const hint = typeKeys.map(k => {
      const n = items.filter(v => v.type === k).length;
      return n ? `${n} ${TYPE_META[k].label.toLowerCase()}` : null;
    }).filter(Boolean).join(" · ");
    html += `<div class="section-h"><h2>${a}</h2><span class="hint">${hint}</span></div>
             <div class="grid">${items.map(card).join("")}</div>`;
  }
  document.getElementById("content").innerHTML = html || '<div class="empty">No venues match these filters.</div>';
  document.getElementById("count").textContent = `Showing ${shown.length} of ${VENUES.length} venues`;
}
function buildChips(el, values, key){
  el.innerHTML = `<button class="chip on" data-v="all">All ${key === "area" ? "areas" : "types"}</button>` +
    values.map(v => `<button class="chip" data-v="${v.v}">${v.label}</button>`).join("");
  el.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", () => {
    el.querySelectorAll(".chip").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    state[key] = btn.dataset.v;
    render();
  }));
}
function init(){
  if (document.title === "Compute Cafe") document.title = CONFIG.title; // standalone use only; built pages keep their spliced title
  document.getElementById("kicker").textContent = CONFIG.kicker;
  document.getElementById("title").textContent = CONFIG.title;
  document.getElementById("subtitle").textContent = CONFIG.subtitle;
  const dedicated = VENUES.filter(v => v.flag === "dedicated").length;
  const stats = [
    { n: String(VENUES.length), l: "venues vetted" },
    { n: String(dedicated), l: "with dedicated events pages" },
    { n: String(AREAS.length), l: AREAS.length === 1 ? "neighborhood" : "neighborhoods" },
  ];
  if (CONFIG.extraStat) stats.push(CONFIG.extraStat);
  document.getElementById("stats").innerHTML =
    stats.map(s => `<div class="stat"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`).join("");
  document.getElementById("foot").innerHTML =
    CONFIG.footnotes.map(f => `<div class="fnote">${f}</div>`).join("") +
    `<div class="prov">${CONFIG.provenance}</div>`;
  buildChips(document.getElementById("f-area"), AREAS.map(a => ({v:a, label:a})), "area");
  buildChips(document.getElementById("f-type"), typeKeys.map(k => ({v:k, label:`${TYPE_META[k].icon} ${TYPE_META[k].label}s`})), "type");
  const flagBtn = document.querySelector('#f-flag .chip');
  flagBtn.addEventListener("click", () => {
    state.dedicatedOnly = !state.dedicatedOnly;
    flagBtn.classList.toggle("on", state.dedicatedOnly);
    render();
  });
  render();
}
function cycleTheme(){
  const r = document.documentElement;
  const cur = r.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  r.setAttribute("data-theme", next);
  if (window.__syncMapTheme) window.__syncMapTheme();
}

/* star-venue wiring */
const STAR_KEY = (c,k) => 'starred:'+c+':'+k;
async function hydrateStars(){
  const btns = document.querySelectorAll('.starh');
  const city = CITY_SLUG || 'unknown';
  for (const b of btns) {
    const k = b.dataset.k;
    if (!k) continue;
    // hydrate per-browser star state
    try {
      if (localStorage.getItem(STAR_KEY(city,k)) === '1') b.classList.add('on');
    } catch{}
    // display count from KV if available
    try {
      const r = await fetch('/api/star-venue/'+encodeURIComponent(city)+'/'+encodeURIComponent(k));
      if (r.ok) {
        const j = await r.json();
        b.innerHTML = '<span class="star">★</span><span class="cnt">'+(j.newCount||j.count||0)+'</span>';
      } else {
        b.innerHTML = '<span class="star">☆</span>';
      }
    } catch {
      b.innerHTML = '<span class="star">☆</span>';
    }
    b.addEventListener('click', async () => {
      const key = STAR_KEY(city,k);
      let saved = false;
      try { saved = localStorage.getItem(key) === '1'; } catch{}
      if (saved) return; // already starred on this browser
      try { localStorage.setItem(key,'1'); saved = true; } catch{}
      b.classList.add('on');
      try {
        const resp = await fetch('/api/star-venue', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({k, city})
        });
        const j = await resp.json();
        if (j.ok && j.newCount != null) b.querySelector('.cnt').textContent = j.newCount;
      } catch {}
    });
  }
}
init();
hydrateStars();


/* Submit Venue modal + GitHub Issues-backed pipeline */
const cityNames = (CONFIG.title || "").replace(/— Venue Options|,.*$/, "").trim();
document.getElementById("submit-city-name").textContent = cityNames || CONFIG.kicker;
function toggleSubmitModal(open) {
  const m = document.getElementById("submission-modal");
  m.classList.toggle("open", open);
  m.setAttribute("aria-hidden", String(!open));
  if (open) setTimeout(() => m.querySelector("input[name='name']")?.focus(), 0);
}
window.toggleSubmitModal = toggleSubmitModal;

function renderSubmissionCard(venue) {
  const t = TYPE_META[venue.type] || { label: venue.type, icon: "📍" };
  const flagHtml = venue.flag === "dedicated"
    ? '<span class="flag dedicated">✓ Dedicated events page</span>'
    : '<span class="flag contact">✉ Events contact only</span>';
  const imgHtml = venue.img
    ? `<img src="${venue.img}" alt="${venue.alt}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.card').classList.add('noimg')">`
    : "";
  const emailBtn = venue.email ? `<a class="btn sec" href="mailto:${venue.email}">${venue.email}</a>` : "";
  return `<div class="card${venue.img ? "" : " noimg"}">
    <div class="imgbox">
      ${imgHtml}
      <div class="ph"><span class="icn">${t.icon}</span><span class="mono">${venue.name.replace(/[^a-zA-Z ]/g,"").split(" ").slice(0,2).map(w=>w[0].toUpperCase()).join("")}</span></div>
      <div class="areatag">${venue.area || "Submitted"}</div>
    </div>
    <div class="body">
      <div class="titlerow"><div class="vname">${venue.name}</div><span class="typechip">${t.icon} ${t.label}</span></div>
      <div class="addr"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(venue.name + " " + (venue.addr || ""))}" target="_blank" rel="noopener">📍 ${venue.addr}</a></div>
      <div class="cap">${venue.cap}</div>
      ${flagHtml}
      <div class="note">${venue.note}</div>
      <div class="links"><a class="btn pri" href="${venue.link}" target="_blank" rel="noopener">${venue.linkText || "Visit"} ↗</a>${emailBtn}</div>
    </div>
  </div>`;
}

document.getElementById("venue-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const status = document.getElementById("submit-status");
  const send = document.getElementById("submit-send");
  send.disabled = true;
  status.textContent = "Checking link…";
  status.className = "status";
  const data = Object.fromEntries(new FormData(form).entries());
  data.city = (CONFIG.title || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "unknown";
  data.flag = data.flag || "contact";
  try {
    const resp = await fetch("/api/submit-venue", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    const json = await resp.json();
    if (!resp.ok || !json.ok) {
      status.textContent = json.error === "dead_link" ? "That URL did not respond — please double-check it." : (json.detail || "Submission failed.");
      status.className = "status error";
      send.disabled = false;
      return;
    }
    status.textContent = "Published — it's in " + (CONFIG.title || "the grid") + " now. Issue #" + json.issue.number + " tracks the review.";
    status.className = "status success";
    form.reset();
    toggleSubmitModal(false);
    // auto-publish: append the returned venue card into the first area section (no re-fetch)
    const content = document.getElementById("content");
    const sectors = content.querySelectorAll(".grid section");
    if (sectors.length === 0) {
      content.insertAdjacentHTML("beforeend", renderSubmissionCard(json.venue));
    } else {
      sectors[0].insertAdjacentHTML("afterbegin", renderSubmissionCard(json.venue));
    }
  } catch (err) {
    status.textContent = "Network error — try again.";
    status.className = "status error";
    send.disabled = false;
  }
});
