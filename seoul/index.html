<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seoul — Venue Options · ComputeCafe</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<!--
  COMPUTE CAFE EXPLORER TEMPLATE
  Edit ONLY the CONFIG, TYPE_META, and VENUES blocks in the <script> at the
  bottom (plus <title> above). Filter chips, section headers, and header stats
  all derive from the data — no markup edits needed for a new city or venue mix.
  Keep the file self-contained: no external CSS/JS/fonts beyond Leaflet from unpkg;
  geocoding caches per-browser via the browser Cache API (works without localStorage).
-->
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink-1: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #898781;
    --hairline: rgba(11,11,11,0.10);
    --grid: #e1e0d9;
    --accent-a: #eb6834;
    --accent-a-soft: rgba(235,104,52,0.12);
    --accent-b: #2a78d6;
    --accent-b-soft: rgba(42,120,214,0.12);
    --accent-c: #6f4fce;
    --accent-c-soft: rgba(111,79,206,0.12);
    --good: #0ca30c;
    --good-soft: rgba(12,163,12,0.10);
    --chip-on: #0b0b0b;
    --chip-on-ink: #fcfcfb;
    --ph-a: #f3e7dc;
    --ph-b: #e8d5c2;
    --ph-c: #dde8f3;
    --ph-d: #c9d9ec;
    --ph-e: #e7ddf3;
    --ph-f: #d6c8ec;
    --shadow: 0 1px 2px rgba(11,11,11,0.05), 0 4px 14px rgba(11,11,11,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --hairline: rgba(255,255,255,0.10); --grid: #2c2c2a;
      --accent-a: #d95926; --accent-a-soft: rgba(217,89,38,0.18);
      --accent-b: #3987e5; --accent-b-soft: rgba(57,135,229,0.18);
      --accent-c: #8f6ee8; --accent-c-soft: rgba(143,110,232,0.18);
      --good: #0ca30c; --good-soft: rgba(12,163,12,0.16);
      --chip-on: #ffffff; --chip-on-ink: #0d0d0d;
      --ph-a: #33281f; --ph-b: #453425; --ph-c: #1f2a38; --ph-d: #2a3a4e;
      --ph-e: #291f38; --ph-f: #382a4e;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
    --hairline: rgba(255,255,255,0.10); --grid: #2c2c2a;
    --accent-a: #d95926; --accent-a-soft: rgba(217,89,38,0.18);
    --accent-b: #3987e5; --accent-b-soft: rgba(57,135,229,0.18);
    --accent-c: #8f6ee8; --accent-c-soft: rgba(143,110,232,0.18);
    --good: #0ca30c; --good-soft: rgba(12,163,12,0.16);
    --chip-on: #ffffff; --chip-on-ink: #0d0d0d;
    --ph-a: #33281f; --ph-b: #453425; --ph-c: #1f2a38; --ph-d: #2a3a4e;
    --ph-e: #291f38; --ph-f: #382a4e;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink-1);
    line-height: 1.45; padding: 28px 20px 40px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header.hero { margin-bottom: 18px; }
  .kicker {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent-a); margin-bottom: 6px;
  }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: var(--ink-2); font-size: 14px; margin-top: 6px; max-width: 70ch; }
  .statrow { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 16px; }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--ink-3); }
  .hdrbtns {
    float: right; display: flex; flex-wrap: wrap; justify-content: flex-end;
    gap: 8px; margin: -2px 0 8px 14px; position: relative; z-index: 11;
  }
  .themebtn, .mapbtn, .submitbtn {
    font-size: 12px; color: var(--ink-2); background: var(--surface);
    border: 1px solid var(--hairline); border-radius: 999px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .themebtn:hover, .mapbtn:hover { color: var(--ink-1); }
  .mapbtn.open { color: var(--accent-a); border-color: var(--accent-a); }
  .starh { display: inline-flex; align-items: center; gap: 4px; font-size: 13px;
    border: 1px solid var(--hairline); background: var(--surface);
    border-radius: 999px; padding: 3px 9px; cursor: pointer; user-select: none; }
  .starh:hover { background: var(--accent-a-soft); }
  .starh .cnt { font-size: 11.5px; color: var(--ink-2); }
  .starh.on { color: #c2570f; border-color: #c2570f; }
  .starh.on .cnt { color: var(--ink-1); font-weight: 600; }

  .submitbtn {
    font-weight: 600; color: var(--accent-b);
    background: var(--accent-b-soft); border-color: var(--accent-b);
  }
  .submitbtn:hover { color: var(--ink-1); }
  .submission-modal {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,0.45); align-items: center; justify-content: center;
  }
  .submission-modal.open { display: flex; }
  .submission-modal .dialog {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 16px; padding: 24px; width: min(480px, 92vw);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .submission-modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .submission-modal label { display: block; font-size: 12px; color: var(--ink-3); margin: 10px 0 4px; }
  .submission-modal input, .submission-modal textarea, .submission-modal select {
    width: 100%; padding: 8px 10px; font-size: 13px;
    background: var(--page); color: var(--ink-1);
    border: 1px solid var(--hairline); border-radius: 8px;
    font-family: inherit;
  }
  .submission-modal .foot { margin-top: 16px; display: flex; gap: 10px; align-items: center; }
  .submission-modal .status { font-size: 12px; color: var(--ink-3); margin-left: auto; }
  .submission-modal .error { color: #d65a4a; }
  .submission-modal .success { color: var(--good); }
  #mapbox {
    display: none; position: fixed; top: 0; right: 0;
    width: 50vw; height: 100vh; z-index: 10;
    border-left: 1px solid var(--hairline);
    background: var(--page);
    box-shadow: -8px 0 24px rgba(0,0,0,0.15);
  }
  #mapbox .leaflet-container { height: 100%; }
  @media (max-width: 860px) {
    #mapbox { width: 100vw; }
  }
  .filters {
    position: sticky; top: 0; z-index: 5; background: var(--page);
    padding: 12px 0 10px; margin: 8px 0 6px;
    border-bottom: 1px solid var(--grid);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .fgroup { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 18px; padding: 3px; }
  .chip {
    font-size: 12.5px; font-weight: 500; color: var(--ink-2);
    padding: 5px 12px; border-radius: 999px; border: none; background: transparent;
    cursor: pointer; text-align: left;
  }
  .chip:hover { color: var(--ink-1); }
  .chip.on { background: var(--chip-on); color: var(--chip-on-ink); font-weight: 600; }
  .count { margin-left: auto; font-size: 12px; color: var(--ink-3); }
  .section-h { display: flex; align-items: baseline; gap: 10px; margin: 26px 2px 12px; }
  .section-h h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .section-h .hint { font-size: 12px; color: var(--ink-3); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
    display: flex; flex-direction: column;
  }
  .imgbox { position: relative; aspect-ratio: 16/9.5; overflow: hidden; }
  .imgbox img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph {
    position: absolute; inset: 0; z-index: 0; display: flex;
    align-items: center; justify-content: center; flex-direction: column; gap: 6px;
  }
  .card.noimg img { display: none; }
  .ph.t0 { background: linear-gradient(135deg, var(--ph-a), var(--ph-b)); }
  .ph.t1 { background: linear-gradient(135deg, var(--ph-c), var(--ph-d)); }
  .ph.t2 { background: linear-gradient(135deg, var(--ph-e), var(--ph-f)); }
  .ph .mono { font-size: 30px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink-2); opacity: 0.85; }
  .ph .icn { font-size: 22px; }
  .toppick {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    font-size: 11px; font-weight: 700; background: rgba(11,11,11,0.78); color: #fff;
    padding: 4px 9px; border-radius: 999px; backdrop-filter: blur(4px);
  }
  .areatag {
    position: absolute; bottom: 10px; left: 10px; z-index: 2;
    font-size: 11px; font-weight: 600; background: rgba(11,11,11,0.62); color: #fff;
    padding: 3px 9px; border-radius: 999px; backdrop-filter: blur(4px);
  }
  .body { padding: 14px 16px 15px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .titlerow { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .vname { font-size: 16.5px; font-weight: 700; letter-spacing: -0.01em; }
  .typechip { flex: none; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; margin-top: 1px; }
  .typechip.t0 { color: var(--accent-a); background: var(--accent-a-soft); }
  .typechip.t1 { color: var(--accent-b); background: var(--accent-b-soft); }
  .typechip.t2 { color: var(--accent-c); background: var(--accent-c-soft); }
  .addr { font-size: 12.5px; }
  .addr a { color: var(--ink-3); text-decoration: none; }
  .addr a:hover { color: var(--ink-1); text-decoration: underline; }
  .cap { font-size: 12.5px; color: var(--ink-2); }
  .cap b { color: var(--ink-1); font-weight: 600; }
  .flag {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 7px; align-self: flex-start;
  }
  .flag.dedicated { color: var(--good); background: var(--good-soft); }
  .flag.contact { color: var(--ink-2); background: var(--page); border: 1px solid var(--hairline); }
  .note { font-size: 13px; color: var(--ink-2); flex: 1; }
  .links { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .btn { font-size: 12.5px; font-weight: 600; text-decoration: none; padding: 7px 13px; border-radius: 8px; }
  .btn.pri { background: var(--ink-1); color: var(--page); }
  .btn.pri:hover { opacity: 0.85; }
  .btn.sec { color: var(--ink-2); border: 1px solid var(--hairline); }
  .btn.sec:hover { color: var(--ink-1); border-color: var(--ink-3); }
  .empty { color: var(--ink-3); font-size: 14px; padding: 40px 0; text-align: center; }
  footer { margin-top: 34px; border-top: 1px solid var(--grid); padding-top: 18px; display: grid; gap: 14px; }
  .fnote { font-size: 13px; color: var(--ink-2); max-width: 90ch; }
  .fnote b { color: var(--ink-1); }
  .prov { font-size: 11.5px; color: var(--ink-3); }
  @media (max-width: 640px) {
    body { padding: 18px 12px 30px; }
    h1 { font-size: 22px; }
    .count { flex-basis: 100%; margin-left: 2px; }
  }
  @media (min-width: 901px) {
    body.map-open .wrap { max-width: calc(50vw - 44px); margin: 0; }
    body.map-open .grid { grid-template-columns: 1fr; }
  }
  .homelink { font-size: 12.5px; font-weight: 600; color: var(--ink-3); text-decoration: none; display: inline-block; margin-bottom: 8px; }
  .homelink:hover { color: var(--ink-1); }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hdrbtns">
      <button class="submitbtn" id="submitbtn" onclick="toggleSubmitModal(true)">＋ Submit Venue</button>
      <button class="mapbtn" id="mapbtn" onclick="toggleCityMap()">🗺️ View Map</button>
      <button class="themebtn" id="themebtn" onclick="cycleTheme()">◐ Theme</button>
    </div>
    <a class="homelink" href="/">← ComputeCafe</a>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
    <div class="statrow" id="stats"></div>
  </header>
  <div class="filters">
    <div class="fgroup" id="f-area"></div>
    <div class="fgroup" id="f-type"></div>
    <div class="fgroup" id="f-flag">
      <button class="chip" data-v="dedicated">✓ Dedicated events page only</button>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div id="content"></div>
  <div id="mapbox" aria-hidden="true"></div>
  <div class="submission-modal" id="submission-modal" role="dialog" aria-modal="true" aria-labelledby="submission-title">
    <div class="dialog">
      <h3 id="submission-title">Suggest a venue for <span id="submit-city-name"></span></h3>
      <form id="venue-form" novalidate>
        <label>Name * <input name="name" required maxlength="80"></label>
        <label>Address * <input name="addr" required maxlength="120" placeholder="e.g. 123 Main St, City"></label>
        <label>Capacity * <input name="cap" required maxlength="60" placeholder="e.g. ~100 standing / 150"></label>
        <label>Private-events URL * <input name="link" required type="url" maxlength="240" placeholder="https://…"></label>
        <label>Type * <select name="type"><option value="coffee">Coffee shop</option><option value="cowork">Coworking / event space</option><option value="event">Event space</option></select></label>
        <label>Area <input name="area" maxlength="60" placeholder="neighborhood (optional)"></label>
        <label>Events email <input name="email" type="email" maxlength="80" placeholder="events@… (optional)"></label>
        <label>Photo URL <input name="img" type="url" maxlength="240" placeholder="hotlinked interior/patio (optional)"></label>
        <label>Why it works for a 50–200 coffee/hack * <textarea name="note" required rows="2" maxlength="400"></textarea></label>
        <label>What's the photo of? <input name="alt" maxlength="80" placeholder="short photo caption"></label>
        <div class="foot">
          <button type="submit" class="btn pri" id="submit-send">Submit.</button>
          <button type="button" class="btn sec" onclick="toggleSubmitModal(false)">Cancel</button>
          <span class="status" id="submit-status"></span>
        </div>
      </form>
    </div>
  </div>
  <footer id="foot"></footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* Map primitives — Leaflet helpers (also used by index.html) */
(function () {
  const ACCENT = { live: "#0ca30c", rsvp: "#2a78d6", soon: "#898781" };
  const isDark = () => {
    const t = document.documentElement.getAttribute("data-theme");
    return t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  };
  function baseLayers(L) {
    return {
      light: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }),
      // Earth at night for world/regional zoom; native imagery stops at z8
      darkNight: L.tileLayer("https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_CityLights_2012/default/2012-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpg", {
        maxZoom: 19, maxNativeZoom: 8,
        attribution: "NASA Earth at Night (VIIRS) · EOSDIS GIBS",
      }),
      // closer than z8 the night imagery is a blur — dark streets instead
      darkStreet: L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png", {
        maxZoom: 19, subdomains: "abcd",
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
      }),
    };
  }
  function applyBase(map) {
    map = map || window.__map;
    if (!map || !map.__layers || !map._loaded) return;  // no view yet: initMap set the default
    const L2 = map.__layers;
    const want = !isDark() ? L2.light : (map.getZoom() > 8 ? L2.darkStreet : L2.darkNight);
    if (!map.hasLayer(want)) map.addLayer(want);        // add before remove: no basemap flash
    [L2.light, L2.darkNight, L2.darkStreet].forEach(l => {
      if (l !== want && map.hasLayer(l)) { try { map.removeLayer(l); } catch (e) {} }
    });
  }
  window.__syncMapTheme = function () { applyBase(window.__map); };


  function fitView(map, lls) {
    const L = window.L;
    if (!lls.length) { map.setView([20, 0], 2); return; }
    if (lls.length === 1) map.setView(lls[0], 12);
    else map.fitBounds(L.latLngBounds(lls), { padding: [30, 30] });
  }
  function addMarker(map, it) {
    const L = window.L;
    const isCity = !!it.kind && it.kind === "city";
    const color = isCity ? (ACCENT[it.status] || ACCENT.soon) : ACCENT.live;
    const m = L.circleMarker([it.lat, it.lng], {
      radius: isCity ? 7 : 6, color, weight: 2, fillColor: color, fillOpacity: 0.55,
    });
    const href = it.href;
    const sub = it.area || it.date || "";
    m.bindPopup(`<div style="max-width:220px"><b>${it.name}</b><div style="font-size:12px;color:#666">${sub}</div>${href ? `<div style="margin-top:6px"><a href="${href}" ${href.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>Open →</a></div>` : ""}</div>`);
    m.addTo(map);
    if (href) m.on("click", () => m.openPopup());
    return m;
  }

  window.initMap = function (container, data) {
    const L = window.L;
    if (!L) return null;
    const el = container;
    el.innerHTML = "";
    const map = L.map(el, { zoomControl: true, scrollWheelZoom: false });
    const pts = [];
    (data.venues || []).forEach(v => pts.push(v));
    (data.cities || []).forEach(c => pts.push(c));
    map.__marks = [];
    const latLngs = [];
    pts.forEach(it => {
      const m = addMarker(map, it);
      map.__marks.push({ it, m });
      latLngs.push(m.getLatLng());
    });
    const fit = () => fitView(map, latLngs);
    fit();
    // if the panel mounted at zero size (hidden parent, background tab), refit
    // once it gets real dimensions — otherwise the view stays at max zoom
    if (window.ResizeObserver) {
      let settled = map.getSize().x > 0;
      const ro = new ResizeObserver(() => {
        if (settled || el.clientWidth === 0) return;
        settled = true;
        map.invalidateSize();
        fit();
        applyBase(map);
      });
      ro.observe(el);
    }
    // basemap last: the view (and therefore the zoom) is settled, so the
    // night/street choice is right on the first paint — no double layer
    map.__layers = baseLayers(L);
    applyBase(map);
    map.on("zoomend", () => applyBase(map));
    return map;
  };

  window.toggleMap = function (container, data) {
    const el = container;
    if (el.style.display === "block") {
      el.style.display = "none";
      el.setAttribute("aria-hidden", "true");
      document.body.classList.remove("map-open");
      return false;
    }
    el.style.display = "block";
    el.setAttribute("aria-hidden", "false");
    document.body.classList.add("map-open");
    if (!el.dataset.mounted) {
      el.dataset.mounted = "1";
      // force a synchronous reflow so the panel has real dimensions before the
      // map reads them (rAF would not fire in a background tab)
      void el.offsetHeight;
      window.__map = window.initMap(el, data);
    } else if (window.__map) {
      window.__map.invalidateSize();
    }
    return true;
  };

  // Venues carry build-time lat/lng (scripts/geocode_configs.py) — no client geocoding.
  function venuePts(list) {
    return (typeof list !== "undefined" ? list : [])
      .filter(v => v.lat && v.lng)
      .map(v => ({ name: v.name, area: v.area, href: v.link, lat: v.lat, lng: v.lng }));
  }
  // Re-point the open map at a new venue set (filter chips / flag toggle).
  window.syncMapFilters = function (list) {
    const map = window.__map;
    if (!map) return;
    (map.__marks || []).forEach(({ m }) => { try { map.removeLayer(m); } catch (e) {} });
    const lls = [];
    map.__marks = venuePts(list).map(it => {
      const m = addMarker(map, it);
      lls.push(m.getLatLng());
      return { it, m };
    });
    fitView(map, lls);
  };
  window.toggleCityMap = function () {
    const el = document.getElementById("mapbox");
    const openList = (typeof filteredVenues === "function") ? filteredVenues()
      : (typeof VENUES !== "undefined" ? VENUES : []);
    const open = window.toggleMap(el, { venues: venuePts(openList) });
    const btn = document.getElementById("mapbtn");
    btn.textContent = open ? "🗺️ Hide Map" : "🗺️ View Map";
    btn.classList.toggle("open", !!open);
    btn.setAttribute("aria-pressed", String(!!open));
    if (open) window.syncMapFilters(openList);
  };
})();

const CITY_SLUG = location.pathname.split("/").filter(Boolean).pop() || "";

const state = { area: "all", type: "all", dedicatedOnly: false };
const AREAS = [...new Set(VENUES.map(v => v.area))];
const typeKeys = Object.keys(TYPE_META);
const tcls = t => "t" + (typeKeys.indexOf(t) % 3);

function initials(name){
  return name.replace(/[^a-zA-Z ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
}
function mapsUrl(v){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(v.name + " " + v.addr);
}
function card(v){
  const t = TYPE_META[v.type] || { label: v.type, icon: "📍" };
  const flagHtml = v.flag === "dedicated"
    ? '<span class="flag dedicated">✓ Dedicated events page</span>'
    : '<span class="flag contact">✉ Events contact only</span>';
  const imgHtml = v.img
    ? `<img src="${v.img}" alt="${v.alt}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.card').classList.add('noimg')">`
    : "";
  const emailBtn = v.email ? `<a class="btn sec" href="mailto:${v.email}">${v.email}</a>` : "";
  return `<div class="card${v.img ? "" : " noimg"}">
    <div class="imgbox">
      ${imgHtml}
      <div class="ph ${tcls(v.type)}"><span class="icn">${t.icon}</span><span class="mono">${initials(v.name)}</span></div>
      ${v.top ? '<div class="toppick">★ Top pick</div>' : ""}
      <div class="areatag">${v.area}</div>
    </div>
    <div class="body">
      <div class="titlerow"><div class="vname">${v.name}</div><span class="typechip ${tcls(v.type)}">${t.icon} ${t.label}</span></div>
      <div class="addr"><a href="${mapsUrl(v)}" target="_blank" rel="noopener">📍 ${v.addr}</a></div>
      <div class="cap">${v.cap}</div>
      ${flagHtml}
      <div class="note">${v.note}</div>
      <div class="links"><a class="btn pri" href="${v.link}" target="_blank" rel="noopener">${v.linkText} ↗</a>${emailBtn}<button class="starh" data-k="${v.k}" data-city="${CITY_SLUG}"></button></div>
    </div>
  </div>`;
}
function filteredVenues(){
  return VENUES.filter(v =>
    (state.area === "all" || v.area === state.area) &&
    (state.type === "all" || v.type === state.type) &&
    (!state.dedicatedOnly || v.flag === "dedicated"));
}
function render(){
  const shown = filteredVenues();
  const areas = AREAS.filter(a => state.area === "all" || a === state.area);
  let html = "";
  for (const a of areas){
    const items = shown.filter(v => v.area === a);
    if (!items.length) continue;
    const hint = typeKeys.map(k => {
      const n = items.filter(v => v.type === k).length;
      return n ? `${n} ${TYPE_META[k].label.toLowerCase()}` : null;
    }).filter(Boolean).join(" · ");
    html += `<div class="section-h"><h2>${a}</h2><span class="hint">${hint}</span></div>
             <div class="grid">${items.map(card).join("")}</div>`;
  }
  document.getElementById("content").innerHTML = html || '<div class="empty">No venues match these filters.</div>';
  document.getElementById("count").textContent = `Showing ${shown.length} of ${VENUES.length} venues`;
  // keep an open map in lockstep with the chips
  if (window.syncMapFilters && document.getElementById("mapbox")?.style.display === "block") {
    window.syncMapFilters(shown);
  }
}
function buildChips(el, values, key){
  el.innerHTML = `<button class="chip on" data-v="all">All ${key === "area" ? "areas" : "types"}</button>` +
    values.map(v => `<button class="chip" data-v="${v.v}">${v.label}</button>`).join("");
  el.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", () => {
    el.querySelectorAll(".chip").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    state[key] = btn.dataset.v;
    render();
  }));
}
function init(){
  if (document.title === "Compute Cafe") document.title = CONFIG.title; // standalone use only; built pages keep their spliced title
  document.getElementById("kicker").textContent = CONFIG.kicker;
  document.getElementById("title").textContent = CONFIG.title;
  document.getElementById("subtitle").textContent = CONFIG.subtitle;
  const dedicated = VENUES.filter(v => v.flag === "dedicated").length;
  const stats = [
    { n: String(VENUES.length), l: "venues vetted" },
    { n: String(dedicated), l: "with dedicated events pages" },
    { n: String(AREAS.length), l: AREAS.length === 1 ? "neighborhood" : "neighborhoods" },
  ];
  if (CONFIG.extraStat) stats.push(CONFIG.extraStat);
  document.getElementById("stats").innerHTML =
    stats.map(s => `<div class="stat"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`).join("");
  document.getElementById("foot").innerHTML =
    CONFIG.footnotes.map(f => `<div class="fnote">${f}</div>`).join("") +
    `<div class="prov">${CONFIG.provenance}</div>`;
  buildChips(document.getElementById("f-area"), AREAS.map(a => ({v:a, label:a})), "area");
  buildChips(document.getElementById("f-type"), typeKeys.map(k => ({v:k, label:`${TYPE_META[k].icon} ${TYPE_META[k].label}s`})), "type");
  const flagBtn = document.querySelector('#f-flag .chip');
  flagBtn.addEventListener("click", () => {
    state.dedicatedOnly = !state.dedicatedOnly;
    flagBtn.classList.toggle("on", state.dedicatedOnly);
    render();
  });
  render();
}
function cycleTheme(){
  const r = document.documentElement;
  const cur = r.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  r.setAttribute("data-theme", next);
  if (window.__syncMapTheme) window.__syncMapTheme();
}

/* star-venue wiring */
const STAR_KEY = (c,k) => 'starred:'+c+':'+k;
async function hydrateStars(){
  const btns = document.querySelectorAll('.starh');
  const city = CITY_SLUG || 'unknown';
  for (const b of btns) {
    const k = b.dataset.k;
    if (!k) continue;
    // hydrate per-browser star state
    try {
      if (localStorage.getItem(STAR_KEY(city,k)) === '1') b.classList.add('on');
    } catch{}
    // display count from KV if available
    try {
      const r = await fetch('/api/star-venue/'+encodeURIComponent(city)+'/'+encodeURIComponent(k));
      if (r.ok) {
        const j = await r.json();
        b.innerHTML = '<span class="star">★</span><span class="cnt">'+(j.newCount||j.count||0)+'</span>';
      } else {
        b.innerHTML = '<span class="star">☆</span>';
      }
    } catch {
      b.innerHTML = '<span class="star">☆</span>';
    }
    b.addEventListener('click', async () => {
      const key = STAR_KEY(city,k);
      let saved = false;
      try { saved = localStorage.getItem(key) === '1'; } catch{}
      if (saved) return; // already starred on this browser
      try { localStorage.setItem(key,'1'); saved = true; } catch{}
      b.classList.add('on');
      try {
        const resp = await fetch('/api/star-venue', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({k, city})
        });
        const j = await resp.json();
        if (j.ok && j.newCount != null) b.querySelector('.cnt').textContent = j.newCount;
      } catch {}
    });
  }
}
init();
hydrateStars();


/* Submit Venue modal + GitHub Issues-backed pipeline */
const cityNames = (CONFIG.title || "").replace(/— Venue Options|,.*$/, "").trim();
document.getElementById("submit-city-name").textContent = cityNames || CONFIG.kicker;
function toggleSubmitModal(open) {
  const m = document.getElementById("submission-modal");
  m.classList.toggle("open", open);
  m.setAttribute("aria-hidden", String(!open));
  if (open) setTimeout(() => m.querySelector("input[name='name']")?.focus(), 0);
}
window.toggleSubmitModal = toggleSubmitModal;

function renderSubmissionCard(venue) {
  const t = TYPE_META[venue.type] || { label: venue.type, icon: "📍" };
  const flagHtml = venue.flag === "dedicated"
    ? '<span class="flag dedicated">✓ Dedicated events page</span>'
    : '<span class="flag contact">✉ Events contact only</span>';
  const imgHtml = venue.img
    ? `<img src="${venue.img}" alt="${venue.alt}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.card').classList.add('noimg')">`
    : "";
  const emailBtn = venue.email ? `<a class="btn sec" href="mailto:${venue.email}">${venue.email}</a>` : "";
  return `<div class="card${venue.img ? "" : " noimg"}">
    <div class="imgbox">
      ${imgHtml}
      <div class="ph"><span class="icn">${t.icon}</span><span class="mono">${venue.name.replace(/[^a-zA-Z ]/g,"").split(" ").slice(0,2).map(w=>w[0].toUpperCase()).join("")}</span></div>
      <div class="areatag">${venue.area || "Submitted"}</div>
    </div>
    <div class="body">
      <div class="titlerow"><div class="vname">${venue.name}</div><span class="typechip">${t.icon} ${t.label}</span></div>
      <div class="addr"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(venue.name + " " + (venue.addr || ""))}" target="_blank" rel="noopener">📍 ${venue.addr}</a></div>
      <div class="cap">${venue.cap}</div>
      ${flagHtml}
      <div class="note">${venue.note}</div>
      <div class="links"><a class="btn pri" href="${venue.link}" target="_blank" rel="noopener">${venue.linkText || "Visit"} ↗</a>${emailBtn}</div>
    </div>
  </div>`;
}

document.getElementById("venue-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const status = document.getElementById("submit-status");
  const send = document.getElementById("submit-send");
  send.disabled = true;
  status.textContent = "Checking link…";
  status.className = "status";
  const data = Object.fromEntries(new FormData(form).entries());
  data.city = (CONFIG.title || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "unknown";
  data.flag = data.flag || "contact";
  try {
    const resp = await fetch("/api/submit-venue", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    const json = await resp.json();
    if (!resp.ok || !json.ok) {
      status.textContent = json.error === "dead_link" ? "That URL did not respond — please double-check it." : (json.detail || "Submission failed.");
      status.className = "status error";
      send.disabled = false;
      return;
    }
    status.textContent = "Published — it's in " + (CONFIG.title || "the grid") + " now. Issue #" + json.issue.number + " tracks the review.";
    status.className = "status success";
    form.reset();
    toggleSubmitModal(false);
    // auto-publish: append the returned venue card into the first area section (no re-fetch)
    const content = document.getElementById("content");
    const sectors = content.querySelectorAll(".grid section");
    if (sectors.length === 0) {
      content.insertAdjacentHTML("beforeend", renderSubmissionCard(json.venue));
    } else {
      sectors[0].insertAdjacentHTML("afterbegin", renderSubmissionCard(json.venue));
    }
  } catch (err) {
    status.textContent = "Network error — try again.";
    status.className = "status error";
    send.disabled = false;
  }
});
